<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0f1115">
  <title>Contact — Unlock YouTube Comments</title>
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="styles.css">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://unlockyoutubecomments.com/contact.html">
  <meta property="og:title" content="Contact — Unlock YouTube Comments">
  <meta property="og:description" content="Contact the Unlock YouTube Comments team.">
  <meta property="og:image" content="https://jov7.github.io/unlock-youtube-comments-website/images/screenshot-2.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="800">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact — Unlock YouTube Comments">

<body class="contact-page">
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-mark" src="images/logo.svg" alt="" aria-hidden="true"><span>Unlock YouTube Comments</span></a>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a></nav>
  </header>
  <main>
    <p class="eyebrow">Get in touch</p>
    <h1>Contact Us</h1>
    <p class="hero-text">Questions, feedback, or issues with the extension? Send us a message and we'll get back to you at support@unlockyoutubecomments.com.</p>

    <form class="contact-form" action="https://formsubmit.co/milosevic1998@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New message from Unlock YouTube Comments contact form">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>

      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-row">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What's this about?" required>
      </div>

      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="How can we help?" required></textarea>
      </div>

      <button class="button primary" type="submit">Send message</button>
    </form>
  </main>
  <footer><span>© <span id="year"></span> Unlock YouTube Comments</span><div><a href="index.html">Home</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy Policy</a></div></footer>
  <script src="script.js"></script>
</body>
</html>
